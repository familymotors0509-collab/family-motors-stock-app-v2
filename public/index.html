<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f33"><title>Family Motors Stock</title><link rel="manifest" href="/manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f3f6f9;color:#152333}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#071827,#163b5c)}.login-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 20px 60px #0004}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:48px;height:48px;border-radius:14px;background:#e63946;color:white;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:22px}.muted{color:#687789}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid #d7e0e8;border-radius:10px;outline:none}.field input:focus{border-color:#3978a8;box-shadow:0 0 0 3px #3978a822}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800}.primary{background:#0b5a8b;color:#fff}.danger{background:#c62828;color:#fff}.ghost{background:#edf2f6;color:#203242}.app{min-height:100vh}.top{height:68px;background:#0b1f33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.top .brand{margin:0}.top .logo{background:#e63946}.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:230px;background:#fff;border-right:1px solid #e0e6eb;padding:18px}.nav{display:grid;gap:7px}.nav button{text-align:left;background:transparent;border:0;padding:12px;border-radius:10px;color:#435466;font-weight:700}.nav button.active,.nav button:hover{background:#eaf3f8;color:#0b5a8b}.content{flex:1;padding:24px;max-width:1250px}.title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title h2{margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e0e6eb;border-radius:14px;padding:18px}.card .num{font-size:30px;font-weight:900;margin-top:6px}.grid2{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.panel{background:#fff;border:1px solid #e0e6eb;border-radius:14px;padding:18px;margin-bottom:16px}.panel h3{margin-top:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #e7edf1;font-size:14px}.table th{font-size:12px;text-transform:uppercase;color:#6a7887}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.in{background:#e3f5e9;color:#20753a}.out{background:#fde6e6;color:#a52323}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;padding:11px;border:1px solid #d7e0e8;border-radius:10px}.toast{position:fixed;right:18px;bottom:18px;background:#172b3d;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.small{font-size:12px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(520px,100%);background:#fff;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{background:none;border:0;font-size:25px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}@media(max-width:800px){.layout{display:block}.side{width:auto;border-right:0;border-bottom:1px solid #e0e6eb;padding:8px;overflow:auto}.nav{display:flex}.nav button{white-space:nowrap}.content{padding:14px}.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.top{padding:0 14px}.top .brand h1{font-size:17px}.hide-mobile{display:none}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">FM</div><div><h1>Family Motors</h1><div class="muted">3-Wheeler Stock</div></div></div><div class="field"><label>Username</label><input id="loginName" value="Admin" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" value="admin123" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button><p class="muted small" style="margin-bottom:0">First login: Admin / admin123</p></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div class="logo">FM</div><div><b>Family Motors</b><div class="small">Mahindra Commercial 3-Wheeler Stock</div></div></div><div><span id="who" class="small"></span> <button class="btn ghost" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="side"><div class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="stock">Current Stock</button><button data-page="in">Stock IN</button><button data-page="history">History</button><button id="usersNav" data-page="users">Team</button></div></aside><main id="content" class="content"></main></div></div><div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let me=null;
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Something went wrong');return d}
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',5000)}
async function login(){try{me=await api('/api/login',{method:'POST',body:JSON.stringify({name:$('#loginName').value,password:$('#loginPass').value})});showApp()}catch(e){toast(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function init(){try{me=await api('/api/me');showApp()}catch{}}
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=me.name+(me.role==='admin'?' · Admin':'');$('#usersNav').classList.toggle('hidden',me.role!=='admin');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)});render('dashboard')}
async function render(page){if(page==='dashboard')return dashboard();if(page==='stock')return stock();if(page==='in')return stockIn();if(page==='history')return history();if(page==='users')return users()}
async function dashboard(){const d=await api('/api/dashboard');$('#content').innerHTML=`<div class="title"><div><h2>Dashboard</h2><div class="muted">Quick view of your stock</div></div><button class="btn primary" onclick="render('in')">+ Stock IN</button></div><div class="cards"><div class="card"><div class="muted">Current Stock</div><div class="num">${d.total}</div></div><div class="card"><div class="muted">Stock IN Today</div><div class="num">${d.ins}</div></div><div class="card"><div class="muted">Stock OUT Today</div><div class="num">${d.outs}</div></div></div><div class="panel" style="margin-top:16px"><h3>Current stock by model</h3><div class="tablewrap"><table class="table"><thead><tr><th>Model</th><th>Vehicles</th></tr></thead><tbody>${d.models.map(x=>`<tr><td>${esc(x.model)}</td><td><b>${x.count}</b></td></tr>`).join('')||'<tr><td colspan="2">No vehicles in stock</td></tr>'}</tbody></table></div></div>`}
async function stock(q=''){const rows=await api('/api/vehicles'+(q?'?q='+encodeURIComponent(q):''));$('#content').innerHTML=`<div class="title"><div><h2>Current Stock</h2><div class="muted">Only vehicles currently in stock</div></div><button class="btn primary" onclick="render('in')">+ Stock IN</button></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search model, chassis or colour" value="${esc(q)}" onkeydown="if(event.key==='Enter')stock(this.value)"><button class="btn ghost" onclick="stock($('#search').value)">Search</button></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Model</th><th>Chassis</th><th>Colour</th><th>Date</th><th>Added By</th><th>Action</th></tr></thead><tbody>${rows.filter(v=>v.status==='IN STOCK').map(v=>`<tr><td>${esc(v.model)}</td><td><b>${esc(v.chassis)}</b></td><td>${esc(v.colour)}</td><td>${v.received_date}</td><td>${esc(v.added_by_name)}</td><td><button class="btn danger" onclick="outVehicle(${v.id},'${esc(v.chassis)}')">Stock OUT</button></td></tr>`).join('')||'<tr><td colspan="6">No vehicles found</td></tr>'}</tbody></table></div></div>`}
function stockIn(){$('#content').innerHTML=`<div class="title"><div><h2>Stock IN</h2><div class="muted">Add a vehicle to current stock</div></div></div><div class="panel" style="max-width:650px"><div class="field"><label>Model</label><input id="m_model" placeholder="Type model"></div><div class="field"><label>Chassis Number</label><input id="m_chassis" placeholder="Enter chassis number"></div><div class="field"><label>Colour</label><input id="m_colour" placeholder="Enter colour"></div><div class="field"><label>Date Received</label><input id="m_date" type="date" value="${today()}"></div><button class="btn primary" onclick="saveIn()">Save Stock IN</button></div>`}
async function saveIn(){try{await api('/api/vehicles',{method:'POST',body:JSON.stringify({model:$('#m_model').value,chassis:$('#m_chassis').value,colour:$('#m_colour').value,date:$('#m_date').value})});toast('Vehicle added to stock');render('stock')}catch(e){toast(e.message)}}
async function outVehicle(id,chassis){openModal(`<div class="modalhead"><h3>Stock OUT</h3><button class="close" onclick="closeModal()">×</button></div><p>Chassis: <b>${esc(chassis)}</b></p><div class="field"><label>Out Date</label><input id="out_date" type="date" value="${today()}"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmOut(${id})">Confirm Stock OUT</button></div>`)}
async function confirmOut(id){try{await api('/api/vehicles/'+id+'/out',{method:'POST',body:JSON.stringify({date:$('#out_date').value})});closeModal();toast('Vehicle moved to Stock OUT');stock()}catch(e){toast(e.message)}}
async function history(){const rows=await api('/api/history');$('#content').innerHTML=`<div class="title"><div><h2>History</h2><div class="muted">Last 500 stock movements</div></div></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Action</th><th>Model</th><th>Chassis</th><th>Colour</th><th>Staff</th></tr></thead><tbody>${rows.map(v=>`<tr><td>${v.action_date}</td><td><span class="status ${v.action==='IN'?'in':'out'}">${v.action}</span></td><td>${esc(v.model)}</td><td>${esc(v.chassis)}</td><td>${esc(v.colour)}</td><td>${esc(v.user_name)}</td></tr>`).join('')||'<tr><td colspan="6">No history yet</td></tr>'}</tbody></table></div></div>`}
async function users(){if(me.role!=='admin')return;const rows=await api('/api/users');$('#content').innerHTML=`<div class="title"><div><h2>Team</h2><div class="muted">Manage your 4–5 staff accounts</div></div><button class="btn primary" onclick="addUser()">+ Add User</button></div><div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Created</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${u.role}</td><td>${u.created_at.slice(0,10)}</td><td>${u.id!==me.id?`<button class="btn danger" onclick="delUser(${u.id})">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function addUser(){openModal(`<div class="modalhead"><h3>Add Team Member</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="u_name" placeholder="Staff name"></div><div class="field"><label>Password</label><input id="u_pass" type="password" placeholder="Password"></div><div class="field"><label>Role</label><select id="u_role" style="width:100%;padding:12px;border:1px solid #d7e0e8;border-radius:10px"><option value="staff">Staff</option><option value="admin">Admin</option></select></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser()">Create User</button></div>`)}
async function saveUser(){try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('#u_name').value,password:$('#u_pass').value,role:$('#u_role').value})});closeModal();toast('User created');users()}catch(e){toast(e.message)}}
async function delUser(id){if(!confirm('Delete this user?'))return;try{await api('/api/users/'+id,{method:'DELETE'});toast('User deleted');users()}catch(e){toast(e.message)}}
function openModal(x){$('#modalbox').innerHTML=x;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
